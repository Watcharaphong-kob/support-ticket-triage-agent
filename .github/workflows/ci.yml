name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked project
        run: |
          python -m pip install uv==0.12.6
          uv sync --locked
      - name: Host quality and delivery checks
        run: |
          uv run --locked python -m ruff check src tests scripts
          uv run --locked python -m ruff format --check src tests scripts
          uv run --locked python scripts/build_planner.py
          git diff --exit-code
          uv run --locked python scripts/check_delivery.py
          uv build
      - name: Docker integration without paid credentials
        run: |
          cp .env.example .env
          docker compose config --quiet
          uv run --locked python -m pytest tests/test_compose.py -q
          docker compose up -d --build app
          docker compose run --rm app python -m triage_agent.knowledge.manage ingest
          docker compose run --rm -e TRIAGE_TEST_DATABASE=1 app python -m pytest -q -p no:cacheprovider
          docker compose run --rm app python -m triage_agent --input data/sample_tickets.json --offline
      - name: Stop local containers
        if: always()
        run: docker compose down
